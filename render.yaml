services:
  - type: web
    name: ai-sales-agent-api
    runtime: python
    region: oregon
    plan: free
    rootDir: apps/api

    buildCommand: |
      pip install --upgrade pip
      pip install hatchling
      pip install -e ../../packages/domain
      pip install -e "."
      curl -fsSL https://fnm.vercel.app/install | bash -s -- --install-dir "$HOME/.fnm" --skip-shell
      export PATH="$HOME/.fnm:$PATH"
      eval "$(fnm env)"
      fnm install 22
      fnm use 22
      npm install -g mcporter

    startCommand: |
      alembic upgrade head
      PYTHONPATH=../.. python -m database.seeds.demo || true
      uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        sync: false          # set in Render dashboard — uses Supabase
      - key: SECRET_KEY
        generateValue: true
      - key: EXA_API_KEY
        sync: false
      - key: EXA_DISCOVERY_MODE
        value: mcp
      - key: DISCOVERY_MODE
        value: live
      - key: SOURCE_ALLOWED_HOSTS
        value: "linkedin.com,reliefweb.int,zoominfo.com,rocketreach.co,whitepages.com,truepeoplesearch.com,clutch.co,manta.com,apollo.io,signalhire.com,hunter.io,clearbit.com"
      - key: DIALOGUE_MODE
        value: gemini
      - key: VOICE_TRANSPORT
        value: omnidim
      - key: ENABLE_OUTBOUND_PSTN
        value: "true"
      - key: OMNIDIM_TEST_TO_NUMBER
        value: "+919409790464"
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: "admin@signalpath.ai"
      - key: ADMIN_PASSWORD
        value: "admin@3258"
      - key: WEB_ORIGIN
        value: "https://ai-salesagent.vercel.app"
      - key: OMNIDIM_AGENT_ID
        sync: false
      - key: OMNIDIM_API_KEY
        sync: false
      - key: PUBLIC_API_BASE_URL
        value: "https://ai-sales-agent-api.onrender.com"
      - key: CALENDLY_ACCESS_TOKEN
        sync: false
      - key: CALENDLY_EVENT_TYPE_URI
        sync: false
      - key: CALENDLY_ORGANIZATION_URI
        sync: false
      - key: CALENDLY_WEBHOOK_SIGNING_KEY
        sync: false
      - key: OMNIDIM_TOOL_SECRET
        generateValue: true
      - key: SMS_MODE
        value: mock
      - key: BOOKING_RETRY_DELAY_MINUTES
        value: "1440"
      - key: BOOKING_DEMO_MODE
        value: "true"
      - key: BOOKING_SCHEDULER_MODE
        value: inline
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SIGNALWIRE_PROJECT_ID
        sync: false
      - key: SIGNALWIRE_API_TOKEN
        sync: false
      - key: SIGNALWIRE_SPACE
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://ai-salesagent.vercel.app,https://ai-sales-agent.vercel.app,http://localhost:3000"
