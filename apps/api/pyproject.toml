[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sales-agent-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "celery>=5.5,<6",
  "fastapi[standard]>=0.141,<0.142",
  "httpx>=0.28,<0.29",
  "openpyxl>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.43,<2.1",
  "trafilatura==2.2.0",
  "twilio>=9.8,<10",
  "psycopg[binary]>=3.2.9,<4",
  "PyJWT>=2.10,<3",
  "websockets>=17,<18",
  "sales-agent-domain==0.1.0",
  "pypdf>=6.0,<7",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["../.."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "openpyxl", "openpyxl.*", "twilio", "twilio.*"]
ignore_missing_imports = true
