name: ai-sales-agent

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sales_agent
      POSTGRES_USER: sales_agent
      POSTGRES_PASSWORD: sales_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_agent -d sales_agent"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: .
      dockerfile: infrastructure/containers/api.Dockerfile
    working_dir: /workspace
    command:
      - sh
      - -c
      - alembic -c apps/api/alembic.ini upgrade head && python -m database.seeds.demo
    environment:
      DATABASE_URL: postgresql+psycopg://sales_agent:sales_agent@postgres:5432/sales_agent
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/containers/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sales_agent:sales_agent@postgres:5432/sales_agent
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 15

  worker:
    build:
      context: .
      dockerfile: infrastructure/containers/api.Dockerfile
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://sales_agent:sales_agent@postgres:5432/sales_agent
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      ASYNC_MODE: celery
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  voice:
    build:
      context: .
      dockerfile: infrastructure/containers/api.Dockerfile
    command: ["uvicorn", "app.voice_main:app", "--host", "0.0.0.0", "--port", "8001"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sales_agent:sales_agent@postgres:5432/sales_agent
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    build:
      context: .
      dockerfile: infrastructure/containers/web.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
